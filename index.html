<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pitch Chart">
<meta name="theme-color" content="#16392A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Pitch Chart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF2EF; --card:#FFFFFF; --ink:#14201A; --muted:#58695F; --line:#CCD6D0;
  --chase:#E2E8E4; --chip:#F1F4F2;
  --field:#16392A; --field-edge:#0C2419; --board-text:#F4ECC9; --board-lab:#B7C8B3;
  --bulb-b:#45D46B; --bulb-s:#FFB21E; --bulb-o:#FF5140; --bulb-off:#0B2319;
  --primary:#16392A; --primary-ink:#FFFFFF; --focus:#1B6FD8;
  --warn:#9A5200; --danger:#B3261E; --good:#1E7A3E;
  --rB:#4F6F90; --rCS:#B97800; --rSS:#C62828; --rF:#7B4FB0; --rIP:#2E7D32; --rHBP:#5F6368;
  --font:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --cond:"Barlow Condensed","Arial Narrow","Helvetica Neue",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0D1511; --card:#16211B; --ink:#E5EEE8; --muted:#9BAEA3; --line:#2A3A31;
    --chase:#1E2B24; --chip:#1F2C25; --primary:#2E7A55; --warn:#F0A43A; --danger:#FF7A70; --good:#62D08A;
    --rB:#6F93B8; --rCS:#D69A1E; --rSS:#E5534B; --rF:#A07ED6; --rIP:#4FA25A; --rHBP:#8A8F94;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0D1511; --card:#16211B; --ink:#E5EEE8; --muted:#9BAEA3; --line:#2A3A31;
  --chase:#1E2B24; --chip:#1F2C25; --primary:#2E7A55; --warn:#F0A43A; --danger:#FF7A70; --good:#62D08A;
  --rB:#6F93B8; --rCS:#D69A1E; --rSS:#E5534B; --rF:#A07ED6; --rIP:#4FA25A; --rHBP:#8A8F94;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 var(--font)}
main{padding:calc(env(safe-area-inset-top,0px) + 12px) max(12px,env(safe-area-inset-right,0px)) calc(92px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));max-width:1280px;margin:0 auto}
h1,h2,h3{font-family:var(--cond);font-weight:700;line-height:1.1;margin:0}
h1{font-size:32px} h2{font-size:24px} h3{font-size:20px;margin-bottom:10px}
p{margin:0 0 8px}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:14px} .center{text-align:center}
.gap{display:inline-block;width:14px}
.page{display:flex;flex-direction:column;gap:12px}
.page.narrow{max-width:720px;margin:0 auto}
.titlerow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.titlerow.sm{margin-bottom:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.danger{color:var(--danger)}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px}
.btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card)}
.link{background:none;border:0;padding:4px 0;color:var(--focus);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.link.danger{color:var(--danger)}
input,select,textarea{font:16px var(--font);color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:8px;min-height:44px;padding:0 10px;width:100%}
textarea{padding:10px;min-height:140px;line-height:1.5;resize:vertical}
select{appearance:auto}
.form{display:flex;flex-direction:column;gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:15px}
.hint{font-weight:400;font-size:14px;color:var(--muted)}
.empty{padding:32px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}

/* Scoreboard */
.board{background:var(--field);color:var(--board-text);border-radius:14px;box-shadow:inset 0 0 0 3px var(--field-edge);display:grid;grid-template-columns:auto auto auto 1fr;gap:10px 22px;padding:12px 16px;align-items:end}
.bc{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.lab{font:600 14px var(--cond);letter-spacing:.03em;color:var(--board-lab)}
.num{font:700 44px/0.9 var(--cond);font-variant-numeric:tabular-nums}
.bulbs{display:flex;gap:6px;align-items:center;min-height:20px}
.bulbs .sep{width:8px}
.bulb{width:16px;height:16px;border-radius:50%;background:var(--bulb-off);box-shadow:inset 0 2px 3px rgba(0,0,0,.55)}
.bulbs.big .bulb{width:24px;height:24px}
.bulb.on.b{background:var(--bulb-b);box-shadow:0 0 10px var(--bulb-b)}
.bulb.on.s{background:var(--bulb-s);box-shadow:0 0 10px var(--bulb-s)}
.bulb.on.o{background:var(--bulb-o);box-shadow:0 0 10px var(--bulb-o)}
.oadj{display:flex;gap:6px}
.oadj button{width:36px;height:30px;border-radius:8px;border:1px solid #2F5C47;background:transparent;color:var(--board-text);font-size:18px;line-height:1}
.pbtn{justify-self:end;align-items:flex-end;text-align:right;background:transparent;border:1px solid #2F5C47;border-radius:10px;padding:8px 12px;color:var(--board-text)}
.pn{font:600 18px/1.1 var(--cond)}
.pcount{font:700 30px/1 var(--cond);font-variant-numeric:tabular-nums}
.pcount small{font:500 14px var(--cond);color:var(--board-lab)}
.pcount.near{color:var(--bulb-s)} .pcount.over{color:var(--bulb-o)}
@media (max-width:560px){
  .board{grid-template-columns:auto auto auto;gap:10px 18px}
  .pbtn{grid-column:1 / -1;justify-self:stretch;flex-direction:row;justify-content:space-between;align-items:center}
  .num{font-size:40px}
  .livebar .btn{padding:0 6px;font-size:14px}
  .bhead{flex-wrap:wrap}
  .bhead .bact{width:100%;justify-content:flex-start;padding-left:46px;margin-top:-4px}
  .bname h2{font-size:24px}
}
.livebar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

/* Live layout */
.lgrid{display:flex;flex-direction:column;gap:12px}
.lcol{display:contents}
.la-batter{order:1}.la-entry{order:2}.la-seq{order:3}.la-ins{order:4}.la-ai{order:5}
@media (min-width:860px){
  .lgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(380px,440px);align-items:start}
  .lcol{display:flex;flex-direction:column;gap:12px}
  .la-entry{position:sticky;top:12px}
}
.bhead{display:flex;gap:12px;align-items:flex-start}
.slotbig{font:700 44px/0.9 var(--cond);color:var(--muted);min-width:34px}
.bname{flex:1;min-width:0}
.bname h2{font-size:28px;overflow-wrap:anywhere}
.jn{color:var(--muted)}
.bact{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.scout{margin:10px 0 0;padding:8px 10px;border-left:4px solid var(--bulb-s);background:var(--chip);border-radius:0 8px 8px 0}
.hist{list-style:none;margin:12px 0 8px;padding:0;display:flex;flex-direction:column;gap:6px}
.hist li{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.hist .when{font:600 14px var(--cond);color:var(--muted);min-width:56px}
.histlab{font:600 15px var(--cond);color:var(--muted);margin-top:10px}

/* Entry */
.ehead{display:flex;justify-content:space-between;align-items:baseline}
.ptypes{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.pt{border:2px solid var(--pc);background:var(--card);border-radius:10px;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 24px/1 var(--cond);color:var(--pc)}
.pt small{font:500 12px var(--font);color:var(--muted);margin-top:3px}
.pt[aria-pressed="true"]{background:var(--pc);color:#fff}
.pt[aria-pressed="true"] small{color:#fff}
.pt.mini{min-height:40px;font-size:18px;min-width:52px}
.zonebox{margin:12px 0 6px}
.zside{display:flex;justify-content:space-between;width:min(100%,340px,44vh);margin:0 auto 4px;font:600 15px var(--cond);color:var(--muted)}
.zone{position:relative;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr);gap:3px;width:min(100%,340px,44vh);aspect-ratio:1;margin:0 auto}
.z{position:relative;border:0;border-radius:6px;background:var(--chase);font:600 18px var(--cond);color:var(--muted);padding:0}
.z.in{background:var(--card);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink);font-size:22px}
.z[aria-pressed="true"]{background:var(--selc);color:#fff;box-shadow:none}
.kz{position:absolute;pointer-events:none;border:3px solid var(--ink);border-radius:6px;left:calc((100% - 12px) / 5 + 1.5px);top:calc((100% - 12px) / 5 + 1.5px);width:calc((100% - 12px) * 3 / 5 + 9px);height:calc((100% - 12px) * 3 / 5 + 9px)}
.mks{position:absolute;right:3px;bottom:2px;display:flex;gap:2px}
.mk{font:700 11px/1 var(--font);display:inline-flex;align-items:center;justify-content:center;min-width:15px;height:15px;border-radius:8px;color:#fff;padding:0 3px}
.mk.w{background:var(--good)} .mk.h{background:var(--danger)}
.legend .mk{vertical-align:1px}
.spot{display:flex;gap:8px;align-items:center;justify-content:center;margin:4px 0 10px}
.results{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rb{min-height:62px;border:0;border-radius:10px;color:#fff;background:var(--rc);font-weight:700;font-size:16px;line-height:1.15;padding:4px}
.results.dim .rb{opacity:.45}

/* Chips and badges */
.chip{display:inline-flex;align-items:baseline;gap:4px;padding:2px 7px;border-radius:6px;border-left:4px solid var(--pc);background:var(--chip);font:600 15px/1.3 var(--cond);white-space:nowrap}
.chip i{font-style:normal;color:var(--muted)}
.chip em{font-style:normal;font-weight:700}
.chip u{text-decoration:none;color:var(--warn);font-weight:700}
.r-B{color:var(--rB)}.r-CS{color:var(--rCS)}.r-SS{color:var(--rSS)}.r-F{color:var(--rF)}.r-IP{color:var(--rIP)}.r-HBP{color:var(--rHBP)}
.abr{display:inline-block;padding:2px 8px;border-radius:6px;font:700 15px/1.3 var(--cond);background:var(--ink);color:var(--card)}
.abr.hit{background:var(--danger);color:#fff}
.abr.out{background:var(--primary);color:#fff}
.abr.inc{background:transparent;color:var(--muted);border:1px dashed var(--line)}
.seq{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.seq li{display:flex;gap:8px;align-items:center}
.cnt{font:700 16px var(--cond);color:var(--muted);min-width:28px;font-variant-numeric:tabular-nums}

/* Insights */
.ins{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ins li{padding:6px 10px;border-left:4px solid var(--line);background:var(--chip);border-radius:0 8px 8px 0}
.ins li.warn{border-color:var(--bulb-s)} .ins li.bad{border-color:var(--danger)} .ins li.good{border-color:var(--good)}
.ask{display:flex;gap:8px;margin-top:10px}
.aiout{margin-top:12px;padding:12px;background:var(--chip);border-radius:10px}
.aiout p{margin:0 0 6px} .aiout ul{margin:4px 0 8px;padding-left:20px} .aiout h4{margin:10px 0 4px;font:700 18px var(--cond)}
.err{color:var(--danger);font-weight:600;margin-top:10px}

/* Games */
.glist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.grow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.grow>div:first-child{display:flex;flex-direction:column}
.grow.cur{border-color:var(--primary);box-shadow:inset 4px 0 0 var(--primary)}
.gact{display:flex;gap:6px;flex-wrap:wrap}

/* Setup */
.lineup{display:flex;flex-direction:column;gap:8px}
.lrow{display:grid;grid-template-columns:28px 64px 1fr 64px;gap:8px;align-items:center}
.slot{font:700 22px var(--cond);color:var(--muted);text-align:center}
input.num{text-align:center}
select.inline{width:auto;max-width:100%}

/* Settings */
.prow{border-top:1px solid var(--line);padding:12px 0;display:flex;flex-direction:column;gap:8px}
.prow:first-of-type{border-top:0}
.pfields{display:grid;grid-template-columns:64px 1fr 86px;gap:8px}
.ars{display:flex;flex-wrap:wrap;gap:6px}
label.btn.file{cursor:pointer}

/* Chart */
.chartwrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
table.chart{border-collapse:collapse;width:100%;min-width:760px;table-layout:fixed}
.chart th.c-slot{width:44px}.chart th.c-name{width:150px}
.chart th,.chart td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:top;padding:8px;text-align:left}
.chart th{font:700 16px var(--cond);background:var(--chip)}
.chart td.slotc{font:700 22px var(--cond);color:var(--muted);text-align:center;width:40px}
.chart td.namec{min-width:130px;font-weight:600}
.cell{display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.cell .inn{font:600 13px var(--cond);color:var(--muted);width:100%}
.cell.live{outline:2px dashed var(--bulb-s);outline-offset:2px;border-radius:4px}

/* Report */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-bottom:14px}
.tile{background:var(--chip);border-radius:10px;padding:10px}
.tile b{display:block;font:700 30px/1 var(--cond);font-variant-numeric:tabular-nums}
.tile span{font-size:14px;color:var(--muted)}
table.mix{border-collapse:collapse;width:100%}
.mix th,.mix td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.mix th:first-child,.mix td:first-child{text-align:left}
.bar{display:inline-block;height:10px;border-radius:5px;background:var(--pc);vertical-align:middle;margin-right:6px}
.tablewrap{overflow-x:auto}

/* Tabs, modal, toast */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--line);padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.tabs button{border:0;background:none;color:var(--muted);font:600 13px var(--font);min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs button[aria-current="page"] svg{stroke:var(--primary);stroke-width:2.4}
.modal{position:fixed;inset:0;z-index:30;background:rgba(8,18,13,.5);display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none}
.sheet{background:var(--card);width:min(600px,100%);max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.modal{align-items:center}.sheet{border-radius:16px}}
.sheet h2{margin-bottom:12px}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin:8px 0 14px}
.choices .btn{min-height:56px;flex-direction:column;gap:0}
.choices .btn small{font-weight:500;color:var(--muted);font-size:12px}
.choices .btn.hitc{border-color:var(--danger)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--card);padding:10px 16px;border-radius:10px;font-weight:600;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
@media print{
  .tabs,.noprint,.toast{display:none!important}
  body{background:#fff;color:#000}
  main{padding:0}
  .chartwrap{border:0;overflow:visible}
  table.chart{min-width:0;font-size:12px}
}
</style>
</head>
<body>
<main id="view"></main>

<nav class="tabs" aria-label="Sections">
  <button data-act="tab" data-v="live"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 5c2 4 2 10 0 14M16 5c-2 4-2 10 0 14"/></svg>Live</button>
  <button data-act="tab" data-v="chart"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 4v16"/></svg>Chart</button>
  <button data-act="tab" data-v="report"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Report</button>
  <button data-act="tab" data-v="games"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Games</button>
  <button data-act="tab" data-v="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>Settings</button>
</nav>

<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* ---------- Constants ---------- */
const LS_KEY = 'pitchchart.v1';
const PT = {
  FB:{n:'Fastball',c:'#C62828'}, '2S':{n:'Two-seam',c:'#E65100'}, CT:{n:'Cutter',c:'#8D5B3F'},
  SL:{n:'Slider',c:'#2E7D32'}, CB:{n:'Curveball',c:'#1565C0'}, CH:{n:'Changeup',c:'#6A1B9A'},
  SP:{n:'Splitter',c:'#00838F'}, KN:{n:'Knuckleball',c:'#546E7A'}
};
const PT_ORDER = ['FB','2S','CT','SL','CB','CH','SP','KN'];
const RES = {
  B:{n:'Ball',s:'B'}, CS:{n:'Called strike',s:'CS'}, SS:{n:'Swinging strike',s:'SS'},
  F:{n:'Foul',s:'F'}, IP:{n:'In play',s:'X'}, HBP:{n:'Hit by pitch',s:'HB'}
};
const ABR = {
  '1B':{n:'Single',o:0,h:1}, '2B':{n:'Double',o:0,h:1}, '3B':{n:'Triple',o:0,h:1}, HR:{n:'Home run',o:0,h:1},
  GO:{n:'Groundout',o:1}, FO:{n:'Flyout',o:1}, LO:{n:'Lineout',o:1}, PO:{n:'Popout',o:1},
  DP:{n:'Double play',o:2}, FC:{n:"Fielder's choice",o:1}, SAC:{n:'Sacrifice',o:1}, E:{n:'Error',o:0},
  K:{n:'Strikeout swinging',o:1,lbl:'K'}, KL:{n:'Strikeout looking',o:1,lbl:'\uA4D8'},
  BB:{n:'Walk',o:0}, HBP:{n:'Hit by pitch',o:0}, INC:{n:'Inning ended during at-bat',o:0,lbl:'cont.'}
};
const IN_PLAY = ['1B','2B','3B','HR','GO','FO','LO','PO','DP','FC','SAC','E'];
const MANUAL = ['K','KL','BB','HBP',...IN_PLAY];
const MODELS = [
  {id:'claude-sonnet-5', n:'Claude Sonnet 5 (recommended)'},
  {id:'claude-haiku-4-5-20251001', n:'Claude Haiku 4.5 (fastest, lowest cost)'},
  {id:'claude-opus-5-5', n:'Claude Opus 5.5 (most thorough, slower)'}
];

/* ---------- State ---------- */
function defaults(){
  return {v:1, settings:{team:'Valley', apiKey:'', model:'claude-sonnet-5', pitchLimit:110, theme:'auto'},
    pitchers:[], games:[], scouting:{}, currentGameId:null};
}
function load(){
  try{
    const d = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    if(d && d.v){ const base = defaults(); return Object.assign(base, d, {settings:Object.assign(base.settings, d.settings||{})}); }
  }catch(e){}
  return defaults();
}
let S = load();
let view = S.currentGameId ? 'live' : 'games';
let sel = {type:null, loc:null, spot:null};
let aiState = null;
let pendingIP = null;

function save(){

  catch(e){ toast('Could not save on this device. Export a backup from Settings.'); }
}
const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-5);
const G = () => S.games.find(g => g.id === S.currentGameId) || null;
const pitcherById = id => S.pitchers.find(p => p.id === id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lastOf = a => a.length ? a[a.length-1] : undefined;
const pname = p => p ? (p.number ? `#${p.number} ` : '') + (p.name || 'Pitcher') : 'Pitcher';
const bname = (b, slot) => (b.number ? `#${b.number} ` : '') + (b.name || `Batter ${slot+1}`);
const ordinal = n => n + (['th','st','nd','rd'][((n%100)-20)%10] || ['th','st','nd','rd'][n%100] || 'th');
const isStrike = p => p.res !== 'B' && p.res !== 'HBP';
const norm = s => String(s||'').trim().toLowerCase();
function fmtDate(d){ if(!d) return 'No date'; const x = new Date(d+'T12:00:00'); return isNaN(x) ? d : x.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}); }
function mix(arr){ const m = {}; arr.forEach(p => m[p.type] = (m[p.type]||0)+1); return Object.entries(m).sort((a,b) => b[1]-a[1]); }
const fmtMix = arr => mix(arr).map(([t,n]) => `${t} ${n}`).join(', ') || 'none';
const pct = (a,b) => b ? Math.round(a/b*100) + '%' : '\u2013';

/* ---------- Game engine: everything is derived from the event log ---------- */
function countOf(ps){
  let b=0, s=0;
  for(const p of ps){
    if(p.res==='B') b++;
    else if(p.res==='CS' || p.res==='SS') s++;
    else if(p.res==='F' && s<2) s++;
  }
  return {b:Math.min(b,4), s:Math.min(s,3)};
}
function batSide(bats, P){ if(bats==='S') return (P && P.throws==='L') ? 'R' : 'L'; return bats || 'R'; }

function derive(g){
  const lineup = g.lineup.map(x => ({...x}));
  let inning=1, outs=0, slot=0, pid=g.startPitcherId || null;
  const abs=[], allP=[], pc={};
  let cur = {pitches:[]};
  function closeAB(result){
    const lp = lastOf(cur.pitches);
    const apid = lp ? lp.pid : pid;
    abs.push({slot, batter:{...lineup[slot]}, inning, pid:apid, side:batSide(lineup[slot].bats, pitcherById(apid)), pitches:cur.pitches, result});
    cur = {pitches:[]};
  }
  function inningOver(){
    if(cur.pitches.length) closeAB('INC');
    inning++; outs=0;
  }
  for(const e of g.events){
    if(e.t==='pitch'){
      const c = countOf(cur.pitches);
      const p = {type:e.type, loc:e.loc, res:e.res, spot:e.spot||null, pid:e.pid, inning, slot, b:c.b, s:c.s, n:cur.pitches.length+1};
      cur.pitches.push(p); allP.push(p); pc[e.pid] = (pc[e.pid]||0)+1;
    } else if(e.t==='ab'){
      closeAB(e.result);
      outs += (ABR[e.result]?.o || 0);
      slot = (slot+1) % lineup.length;
      if(outs>=3){ inning++; outs=0; }
    } else if(e.t==='out'){
      outs = Math.max(0, outs + e.d);
      if(outs>=3) inningOver();
    } else if(e.t==='endInning'){
      inningOver();
    } else if(e.t==='pitcher'){
      pid = e.id;
    } else if(e.t==='sub'){
      if(lineup[e.slot]) lineup[e.slot] = {...lineup[e.slot], name:e.name, number:e.number, bats:e.bats};
    }
  }
  return {inning, outs, slot, lineup, pid, abs, cur, allP, pc, count:countOf(cur.pitches), batter:lineup[slot]};
}

function timesThrough(d){
  const n = d.abs.filter(a => a.pid===d.pid && a.result!=='INC').length;
  return Math.floor(n / d.lineup.length) + 1;
}
const scoutKey = (opp, name) => norm(opp) + '|' + norm(name);

function batterHist(g, d){
  const b = d.batter;
  const today = d.abs.filter(a => a.slot===d.slot && (!b.name || norm(a.batter.name)===norm(b.name)));
  let past = [];
  if(b.name && g.opponent){
    S.games.filter(x => x.id!==g.id && norm(x.opponent)===norm(g.opponent) && (x.date||'') <= (g.date||'9999'))
      .sort((a,z) => (z.date||'').localeCompare(a.date||''))
      .forEach(x => { const dx = derive(x); dx.abs.filter(a => norm(a.batter.name)===norm(b.name) && a.result!=='INC').forEach(a => past.push({...a, date:x.date})); });
  }
  return {today, past, all:[...today, ...past]};
}

/* ---------- Rendering helpers ---------- */
function locLabel(loc, side){
  if(loc==null) return '';
  const r = Math.floor(loc/5), c = loc%5;
  if(r>=1 && r<=3 && c>=1 && c<=3) return String((r-1)*3 + c);
  const v = r===0 ? 'Up' : r===4 ? 'Dn' : '';
  let h = '';
  if(c===0 || c===4){
    const left = c===0;
    if(side==='R') h = left ? 'In' : 'Aw';
    else if(side==='L') h = left ? 'Aw' : 'In';
    else h = left ? '3B' : '1B';
  }
  return [v,h].filter(Boolean).join('-');
}
function chip(p, side){
  const t = PT[p.type] || {c:'#666'};
  const l = locLabel(p.loc, side);
  return `<span class="chip" style="--pc:${t.c}" title="${esc((PT[p.type]?.n||p.type) + (l?' at '+l:'') + ', ' + RES[p.res].n)}"><b>${esc(p.type)}</b>${l?`<i>${esc(l)}</i>`:''}<em class="r-${p.res}">${RES[p.res].s}</em>${p.spot==='miss'?'<u title="Missed spot">m</u>':''}</span>`;
}
function abBadge(r){
  const a = ABR[r]; if(!a) return '';
  const cls = r==='INC' ? 'inc' : a.h ? 'hit' : a.o ? 'out' : '';
  return `<span class="abr ${cls}" title="${esc(a.n)}">${esc(a.lbl || r)}</span>`;
}
const bulbs = (n, max, cls) => Array.from({length:max}, (_,i) => `<span class="bulb ${cls} ${i<n?'on':''}"></span>`).join('');
function seqText(ps, side){
  return ps.map(p => `${p.type}${p.loc!=null?'@'+locLabel(p.loc,side):''} ${RES[p.res].n.toLowerCase()}${p.spot==='miss'?' (missed spot)':''}`).join(', ');
}
function md(t){
  const lines = esc(t).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').split(/\n/);
  let html = '', inList = false;
  for(const l of lines){
    if(/^\s*[-*\u2022]\s+/.test(l)){ if(!inList){ html += '<ul>'; inList = true; } html += `<li>${l.replace(/^\s*[-*\u2022]\s+/,'')}</li>`; continue; }
    if(inList){ html += '</ul>'; inList = false; }
    if(/^#{1,4}\s/.test(l)) html += `<h4>${l.replace(/^#{1,4}\s/,'')}</h4>`;
    else if(l.trim()) html += `<p>${l}</p>`;
  }
  if(inList) html += '</ul>';
  return html;
}
function aiOut(kinds){
  if(!aiState || !kinds.includes(aiState.kind)) return '';
  if(aiState.loading) return `<p class="muted" style="margin-top:10px">Thinking through the data\u2026</p>`;
  if(aiState.err) return `<p class="err">${esc(aiState.err)}</p>`;
  return `<div class="aiout">${aiState.q?`<p class="muted small">You asked: ${esc(aiState.q)}</p>`:''}${md(aiState.text)}</div>`;
}
function noGame(){
  return `<div class="empty"><h2>No game open</h2><p>Start a game to set their lineup and begin charting.</p><button class="btn primary" data-act="newGame">New game</button>${S.games.length?'<button class="link" data-act="tab" data-v="games">Open a saved game</button>':''}</div>`;
}

/* ---------- Insights (rule-based, always on) ---------- */
function insights(g, d){
  const out = [], add = (lvl, txt) => out.push({lvl, txt});
  const P = d.allP.filter(p => p.pid===d.pid);
  const lim = +S.settings.pitchLimit || 0, pc = P.length;
  if(lim && pc>=lim) add('bad', `${pc} pitches. At or past your ${lim} limit.`);
  else if(lim && pc>=lim-15) add('warn', `${pc} pitches. ${lim-pc} left before your ${lim} limit.`);

  const l3 = P.slice(-3);
  if(l3.length===3 && l3.every(p => p.type===l3[0].type)) add('warn', `Last 3 pitches were all ${PT[l3[0].type]?.n || l3[0].type}. A different pitch or speed breaks the pattern.`);
  if(l3.length===3 && l3[0].loc!=null && l3.every(p => p.loc===l3[0].loc)) add('warn', 'Last 3 pitches were called to the same spot.');

  const firsts = P.filter(p => p.n===1);
  if(firsts.length>=4){
    const [t,n] = mix(firsts)[0];
    if(n/firsts.length>=0.7) add('warn', `First pitch has been ${PT[t]?.n||t} in ${n} of ${firsts.length} at-bats. Hitters may be sitting on it.`);
    const fps = firsts.filter(isStrike).length;
    add(fps/firsts.length>=0.6 ? 'good' : 'info', `First-pitch strikes: ${fps} of ${firsts.length} (${pct(fps, firsts.length)}).`);
  }
  const {b, s} = d.count;
  const inCount = P.filter(p => p.b===b && p.s===s);
  if(inCount.length>=3){
    const top = mix(inCount)[0];
    add(top[1]/inCount.length>=0.75 ? 'warn' : 'info', `In ${b}-${s} counts today: ${fmtMix(inCount)}.`);
  }
  const wh = mix(P.filter(p => p.res==='SS'));
  if(wh.length && wh[0][1]>=2) add('good', `Most swings and misses today: ${PT[wh[0][0]]?.n} (${wh[0][1]}).`);
  const hitBy = {};
  d.abs.filter(a => a.pid===d.pid && ABR[a.result]?.h).forEach(a => { const lp = lastOf(a.pitches); if(lp) hitBy[lp.type] = (hitBy[lp.type]||0)+1; });
  const ht = Object.entries(hitBy).sort((a,z) => z[1]-a[1]);
  if(ht.length && ht[0][1]>=2) add('warn', `${ht[0][1]} hits allowed today on the ${PT[ht[0][0]]?.n}.`);
  const tto = timesThrough(d);
  if(tto>=3) add('warn', `${ordinal(tto)} time through the order. Show this hitter a sequence he hasn't seen.`);

  const h = batterHist(g, d);
  const whiffs = h.all.flatMap(a => a.pitches).filter(p => p.res==='SS');
  if(whiffs.length) add('good', `This hitter has swung through: ${fmtMix(whiffs)}.`);
  const hits = h.all.filter(a => ABR[a.result]?.h);
  if(hits.length) add('warn', `His hits came on: ${hits.map(a => { const lp = lastOf(a.pitches); return lp ? `${lp.type} ${locLabel(lp.loc, a.side)}`.trim() : 'no pitch logged'; }).join(', ')}.`);
  return out;
}

    ${hist.past.length ? `<div class="histlab">Past games vs ${esc(g.opponent)}</div><ul class="hist">${histList(hist.past.slice(0,6),true)}</ul>` : ''}

  return `<div class="live"><div class="lgrid"><div class="lcol">${board}${batter}${seq}${insCard}${ai}</div>${entry}</div></div>`;

function renderChart(){
  const g = G(); if(!g) return noGame();
  const d = derive(g);
  const rows = d.lineup.map((b,i) => ({slot:i, abs:d.abs.filter(a => a.slot===i), live:(i===d.slot && d.cur.pitches.length) ? d.cur.pitches : null}));
  const cols = Math.max(4, ...rows.map(r => r.abs.length + (r.live?1:0)));
  const pitchers = Object.keys(d.pc).map(id => `${esc(pname(pitcherById(id)))}: ${d.pc[id]}`).join('<span class="gap"></span>');
  const head = `<tr><th class="c-slot">#</th><th class="c-name">Batter</th>${Array.from({length:cols}, (_,i) => `<th>AB #${i+1}</th>`).join('')}</tr>`;
  const body = rows.map(r => {
    const names = [...new Set([...r.abs.map(a => bname(a.batter, r.slot)), bname(d.lineup[r.slot], r.slot)])];
    let cells = r.abs.map(a => `<td><div class="cell"><span class="inn">Inn ${a.inning}${a.pid!==d.pid||Object.keys(d.pc).length>1?`, ${esc(pitcherById(a.pid)?.name||'')}`:''}</span>${a.pitches.map(p => chip(p, a.side)).join('')}${abBadge(a.result)}</div></td>`);
    if(r.live){ const side = batSide(d.lineup[r.slot].bats, pitcherById(d.pid)); cells.push(`<td><div class="cell live"><span class="inn">Inn ${d.inning}, now</span>${r.live.map(p => chip(p, side)).join('')}</div></td>`); }
    while(cells.length < cols) cells.push('<td></td>');
    return `<tr><td class="slotc">${r.slot+1}</td><td class="namec">${names.map(esc).join('<br>')}</td>${cells.join('')}</tr>`;
  }).join('');
  return `<div class="page">
    <div class="titlerow"><div><h1>${esc(g.team||S.settings.team)} vs ${esc(g.opponent||'Opponent')}</h1><p class="muted">${fmtDate(g.date)}${pitchers?`<span class="gap"></span>${pitchers}`:''}</p></div><button class="btn noprint" data-act="print">Print</button></div>
    <div class="chartwrap"><table class="chart"><thead>${head}</thead><tbody>${body}</tbody></table></div>
    <p class="muted small">Chips show pitch, location, and result: B ball, CS called strike, SS swinging strike, F foul, X in play, HB hit by pitch. A small m means the pitcher missed the spot.</p>
    <section class="card"><h3>Notes and observations</h3><textarea data-bind="notes" placeholder="Umpire zone, hitters to watch, what to work on in the bullpen">${esc(g.notes)}</textarea></section>
  </div>`;
}

function pStats(d, pid){
  const P = d.allP.filter(p => p.pid===pid);
  const A = d.abs.filter(a => a.pid===pid && a.result!=='INC');
  const firsts = P.filter(p => p.n===1), marked = P.filter(p => p.spot);
  const types = {};
  P.forEach(p => { const t = types[p.type] || (types[p.type] = {n:0,str:0,ss:0,h:0}); t.n++; if(isStrike(p)) t.str++; if(p.res==='SS') t.ss++; });
  A.forEach(a => { if(ABR[a.result]?.h){ const lp = lastOf(a.pitches); if(lp && types[lp.type]) types[lp.type].h++; } });
  return {P, A, n:P.length, str:P.filter(isStrike).length, firsts:firsts.length, fps:firsts.filter(isStrike).length,
    ss:P.filter(p => p.res==='SS').length, bf:A.length, k:A.filter(a => a.result==='K'||a.result==='KL').length,
    bb:A.filter(a => a.result==='BB').length, hbp:A.filter(a => a.result==='HBP').length, h:A.filter(a => ABR[a.result]?.h).length,
    outs:A.reduce((s,a) => s + (ABR[a.result]?.o||0), 0), marked:marked.length, hitSpot:marked.filter(p => p.spot==='hit').length,
    types, firstMix:fmtMix(firsts)};
}
function renderReport(){
  const g = G(); if(!g) return noGame();

/* ---------- Charting actions ---------- */
function commitPitch(res){
  const g = G(); if(!g) return;
  if(!sel.type){ toast('Pick a pitch type first.'); return; }
  const d = derive(g);
  if(!d.pid){ toast('Choose who is pitching first.'); openPitcherModal(); return; }
  const ev = {t:'pitch', pid:d.pid, type:sel.type, loc:sel.loc, res, spot:sel.spot};
  if(res==='IP'){
    pendingIP = ev;
    showModal(`<h2>Ball in play: result?</h2>${resultChoices(IN_PLAY,'ip')}<button class="btn" data-act="closeModal">Cancel</button>`);
    return;
  }
  g.events.push(ev);
  const c = countOf([...d.cur.pitches, {res}]);
  let msg = '';
  if(res==='HBP'){ g.events.push({t:'ab', result:'HBP', auto:true}); msg = 'Hit by pitch. Next batter up.'; }
  else if(c.b>=4){ g.events.push({t:'ab', result:'BB', auto:true}); msg = 'Walk. Next batter up.'; }
  else if(c.s>=3){ const r = res==='CS' ? 'KL' : 'K'; g.events.push({t:'ab', result:r, auto:true}); msg = r==='KL' ? 'Strikeout looking.' : 'Strikeout swinging.'; }
  sel = {type:null, loc:null, spot:null};
  save(); render();
  if(msg) toast(msg + ' Tap Undo to fix.');
}
function openPitcherModal(){
  const g = G(); const d = g ? derive(g) : null;
  showModal(`<h2>Who is pitching?</h2>

    <div class="form"><label>Quick add<input id="qpName" placeholder="Name" autocapitalize="words"></label>

/* ---------- AI ---------- */
const SYS = `You are an assistant pitching coach for a high school baseball team. The pitching coach calls pitches from the dugout and reads your reply on a phone between pitches, so be brief and concrete. Only recommend pitches in the current pitcher's arsenal. Base your reasoning on the charted data; when the sample is small, say so briefly and lean on sound sequencing principles (change eye level, change speeds, work ahead, avoid predictable patterns). Locations use a 5x5 grid from the catcher's view: zones 1-9 are the strike zone (1-3 top row, 7-9 bottom row; 1, 4, 7 are on the catcher's left, which is inside to a right-handed hitter). Up, Dn (down), In, and Aw (away) are chase locations just off the plate. Player health comes first: flag pitch count or fatigue concerns. Never use em dashes.`;

function tendencies(d, pid){
  const P = d.allP.filter(p => p.pid===pid);
  if(!P.length) return 'No pitches yet from this pitcher.';
  const f = fn => P.filter(fn);
  const hitBy = []; d.abs.filter(a => a.pid===pid && ABR[a.result]?.h).forEach(a => { const lp = lastOf(a.pitches); if(lp) hitBy.push(lp); });
  const marked = f(p => p.spot);
  return [
    `Pitch mix today (${P.length} pitches): ${fmtMix(P)}.`,
    `Ahead in count: ${fmtMix(f(p => p.s>p.b))}. Even: ${fmtMix(f(p => p.s===p.b))}. Behind: ${fmtMix(f(p => p.b>p.s))}. Two strikes: ${fmtMix(f(p => p.s===2))}.`,
    `First pitch: ${fmtMix(f(p => p.n===1))}; first-pitch strikes ${f(p => p.n===1 && isStrike(p)).length} of ${f(p => p.n===1).length}.`,
    `Swinging strikes by pitch: ${fmtMix(f(p => p.res==='SS'))}. Called strikes: ${fmtMix(f(p => p.res==='CS'))}. Balls: ${fmtMix(f(p => p.res==='B'))}. Hits allowed by pitch: ${fmtMix(hitBy)}.`,
    marked.length ? `Command: hit the spot on ${marked.filter(p => p.spot==='hit').length} of ${marked.length} tracked pitches; misses by pitch: ${fmtMix(marked.filter(p => p.spot==='miss'))}.` : '',
    `Last 10 pitches, oldest first: ${P.slice(-10).map(p => p.type).join(', ')}.`
  ].filter(Boolean).join('\n');
}
function aiContext(g, d, full){
  const L = [];
  const lim = +S.settings.pitchLimit || 0;
  L.push(`Game: ${g.team||S.settings.team} (we are pitching) vs ${g.opponent||'opponent'}, ${g.date}. High school, 7 innings.`);
  if(!full){
    const P = pitcherById(d.pid), b = d.batter, side = batSide(b.bats, P);
    L.push(`Current pitcher: ${P?pname(P):'unknown'}, throws ${P?.throws||'unknown'}. Arsenal: ${((P&&P.arsenal)||[]).map(t => `${PT[t].n} (${t})`).join(', ')}. Pitches today: ${d.pc[d.pid]||0}${lim?` of a ${lim} limit`:''}.`);
    L.push(`Situation: inning ${d.inning}, ${d.outs} out${d.outs===1?'':'s'}, count ${d.count.b}-${d.count.s}. Batter: ${bname(b,d.slot)}, batting ${ordinal(d.slot+1)}, bats ${b.bats}${b.bats==='S'?`, hitting ${side} vs this pitcher`:''}. ${ordinal(timesThrough(d))} time through the order.`);
    const note = b.name ? S.scouting[scoutKey(g.opponent, b.name)] : '';
    if(note) L.push(`Coach's scouting note on this hitter: ${note}`);
    L.push(`This at-bat so far: ${d.cur.pitches.length ? seqText(d.cur.pitches, side) : 'no pitches yet'}.`);
    const h = batterHist(g, d);
    L.push(`This batter earlier today: ${h.today.length ? h.today.map(a => `inning ${a.inning}: ${seqText(a.pitches,a.side)} => ${ABR[a.result].n}`).join(' | ') : 'none'}.`);
    if(h.past.length) L.push(`This batter in earlier games vs ${g.opponent}: ${h.past.slice(0,8).map(a => `${a.date}: ${seqText(a.pitches,a.side)} => ${ABR[a.result].n}`).join(' | ')}.`);
    L.push(tendencies(d, d.pid));
  } else {
    Object.keys(d.pc).forEach(pid => { const st = pStats(d, pid); const P = pitcherById(pid);
      L.push(`\nPitcher ${pname(P)} (${P?.throws||'?'}HP): ${st.n} pitches, ${pct(st.str,st.n)} strikes, ${st.bf} batters faced, ${st.k} K, ${st.bb} BB, ${st.hbp} HBP, ${st.h} hits, ${st.outs} outs recorded on at-bats.`);
      L.push(tendencies(d, pid)); });
    L.push('\nEvery at-bat in order:');
    d.abs.forEach(a => L.push(`Inning ${a.inning}, spot ${a.slot+1} ${bname(a.batter,a.slot)} (bats ${a.batter.bats}) vs ${pname(pitcherById(a.pid))}: ${seqText(a.pitches,a.side) || 'no pitches'} => ${ABR[a.result].n}`));
    if(g.notes) L.push(`\nCoach's notes: ${g.notes}`);
  }
  return L.join('\n');
}
async function askAI(kind){
  const key = S.settings.apiKey;
  if(!key){ toast('Add your API key in Settings first.'); return; }
  const g = G();
  let prompt = '', maxTokens = 500, q = '';
  if(kind==='test'){ prompt = 'Reply with exactly: Connection works. Ready for the game.'; maxTokens = 30; }
  else {
    if(!g){ toast('Open a game first.'); return; }
    const d = derive(g);
    if(kind==='next') prompt = `${aiContext(g,d,false)}\n\nRecommend the next pitch. Use this format and stay under 70 words:\n**1.** pitch, location: one-sentence reason\n**2.** pitch, location: one-sentence reason\n**Avoid:** one short line`;
    else if(kind==='inning') prompt = `${aiContext(g,d,false)}\n\nGive a between-innings check in under 100 words: what is working, what hitters seem to be adjusting to, and one adjustment for next inning.`;
    else if(kind==='ask'){ const el = document.getElementById('askq'); q = (el && el.value.trim()) || ''; if(!q){ toast('Type a question first.'); return; } prompt = `${aiContext(g,d,false)}\n\nCoach's question: ${q}\nAnswer in under 120 words.`; }
    else if(kind==='report'){ prompt = `${aiContext(g,d,true)}\n\nWrite a postgame pitching report for the coach with short sections: Overview; What worked; What hurt us; Predictability check (patterns hitters could have picked up); Hitters to remember next time we see ${g.opponent||'this team'}; Development focus for each pitcher. Use specific numbers from the data. Under 450 words.`; maxTokens = 1500; }
  }
  aiState = {kind, loading:true, q}; render();
  try{
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:S.settings.model, max_tokens:maxTokens, system:SYS, messages:[{role:'user', content:prompt}]})
    });
    const data = await res.json().catch(() => ({}));
    if(!res.ok){
      const m = data?.error?.message || '';
      if(res.status===401) throw new Error('The API key was rejected. Check it in Settings.');
      if(res.status===404) throw new Error(`Model not found. Pick a different model in Settings. ${m}`);
      if(res.status===429) throw new Error('Rate limit reached. Wait a few seconds and try again.');
      if(res.status===400 && /credit/i.test(m)) throw new Error('Your Anthropic account needs credits. Add them at console.anthropic.com.');
      throw new Error(`AI request failed (${res.status}). ${m}`);
    }
    aiState = {kind, q, text:(data.content||[]).filter(c => c.type==='text').map(c => c.text).join('\n') || 'No reply received.'};
  }catch(e){
    const offline = e instanceof TypeError || !navigator.onLine;
    aiState = {kind, q, err: offline ? 'No connection. The AI needs cell signal or Wi-Fi; charting keeps working offline.' : e.message};
  }
  render();
}

/* ---------- Data export and import ---------- */
function download(name, text, type){
  const blob = new Blob([text], {type});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function exportCSV(){
  const g = G(); if(!g) return;
  const d = derive(g);
  const q = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; };
  const rows = [['date','opponent','inning','lineup_spot','batter','number','hitting_side','ab_for_spot','pitch_in_ab','pitcher','pitch','location','zone_index','result','spot','balls_before','strikes_before','ab_result']];
  const perSlot = {};
  const add = (a, list, result) => { perSlot[a.slot] = (perSlot[a.slot]||0)+1;
    list.forEach(p => rows.push([g.date,g.opponent,p.inning,a.slot+1,a.batter.name,a.batter.number,a.side,perSlot[a.slot],p.n,pname(pitcherById(p.pid)),p.type,locLabel(p.loc,a.side),p.loc ?? '',RES[p.res].n,p.spot||'',p.b,p.s,result?ABR[result].n:'in progress'])); };
  d.abs.forEach(a => add(a, a.pitches, a.result));
  if(d.cur.pitches.length) add({slot:d.slot, batter:d.batter, side:batSide(d.batter.bats, pitcherById(d.pid))}, d.cur.pitches, null);
  download(`pitches-${g.date}-${(g.opponent||'game').replace(/\W+/g,'-')}.csv`, rows.map(r => r.map(q).join(',')).join('\n'), 'text/csv');
}
function importData(file){
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      if(!d || !Array.isArray(d.games)) throw new Error('bad');
      const newGames = d.games.filter(x => !S.games.some(y => y.id===x.id));
      const updated = d.games.filter(x => S.games.some(y => y.id===x.id));
      if(!confirm(`Import ${newGames.length} new game(s)${updated.length?` and replace ${updated.length} game(s) already on this device`:''}?`)) return;
      updated.forEach(x => { const i = S.games.findIndex(y => y.id===x.id); S.games[i] = x; });
      S.games.push(...newGames);
      (d.pitchers||[]).forEach(p => { if(!S.pitchers.some(x => x.id===p.id)) S.pitchers.push(p); });
      Object.assign(S.scouting, d.scouting||{});
      save(); render(); toast('Import complete.');
    }catch(e){ toast('That file is not a Pitch Chart backup.'); }
  };
  r.readAsText(file);
}

/* ---------- Event wiring ---------- */
const A = {
  tab: el => { view = el.dataset.v; aiState = (aiState && aiState.loading) ? aiState : null; render(); window.scrollTo(0,0); },
  newGame: () => {
    const g = {id:uid(), date:new Date().toLocaleDateString('en-CA'), opponent:'', team:S.settings.team, startPitcherId:S.pitchers[0]?.id || null,
      lineup:Array.from({length:9}, () => ({name:'', number:'', bats:'R'})), events:[], notes:'', created:Date.now()};
    S.games.push(g); S.currentGameId = g.id; sel = {type:null,loc:null,spot:null}; save(); view = 'setup'; render(); window.scrollTo(0,0);
  },
  openGame: el => { S.currentGameId = el.dataset.id; save(); view = 'live'; aiState = null; render(); window.scrollTo(0,0); },
  editGame: el => { S.currentGameId = el.dataset.id; save(); view = 'setup'; render(); window.scrollTo(0,0); },
  delGame: el => {
    const g = S.games.find(x => x.id===el.dataset.id);
    if(!g || !confirm(`Delete the game vs ${g.opponent||'this opponent'} on ${fmtDate(g.date)}? This cannot be undone.`)) return;
    S.games = S.games.filter(x => x.id!==g.id);
    if(S.currentGameId===g.id) S.currentGameId = null;
    save(); render();
  },
  ptype: el => { sel.type = sel.type===el.dataset.t ? null : el.dataset.t; render(); },
  zone: el => { const i = +el.dataset.i; sel.loc = sel.loc===i ? null : i; render(); },
  spot: el => { sel.spot = sel.spot===el.dataset.s ? null : el.dataset.s; render(); },
  clearSel: () => { sel = {type:null,loc:null,spot:null}; render(); },
  res: el => commitPitch(el.dataset.r),
  undo: () => {
    const g = G(); if(!g || !g.events.length) return;
    const e = g.events.pop();
    if(e.t==='ab' && e.auto && lastOf(g.events)?.t==='pitch') g.events.pop();
    const label = {pitch:'last pitch', ab:'at-bat result and its pitch', out:'out change', endInning:'end of inning', pitcher:'pitching change', sub:'substitution'}[e.t] || 'last entry';
    save(); render(); toast(`Undid ${e.t==='ab' && !e.auto ? 'at-bat result' : label}.`);
  },
  outs: el => { const g = G(); if(!g) return; const d = derive(g); const n = +el.dataset.d; if(n<0 && d.outs===0){ toast('Already at 0 outs.'); return; }
    g.events.push({t:'out', d:n}); save(); render(); if(n>0 && d.outs===2) toast(`Third out. Inning ${d.inning} is over.`); },
  endInning: () => { const g = G(); if(!g) return; const d = derive(g); g.events.push({t:'endInning'}); save(); render(); toast(`Inning ${d.inning} ended. Undo if that was a mistake.`); },
  endAB: () => { if(!G()) return; showModal(`<h2>End this at-bat</h2><p class="muted">For anything the pitch buttons don't finish, like an intentional walk or a dropped third strike.</p>${resultChoices(MANUAL,'manual')}<button class="btn" data-act="closeModal">Cancel</button>`); },
  abres: el => {
    const g = G(); if(!g) return;
    const r = el.dataset.r;
    if(el.dataset.mode==='ip' && pendingIP){ g.events.push(pendingIP, {t:'ab', result:r, auto:true}); sel = {type:null,loc:null,spot:null}; }
    else g.events.push({t:'ab', result:r});
    closeModal(); save(); render(); toast(`${ABR[r].n}. Next batter up.`);
  },
  closeModal,
  pickPitcher: () => openPitcherModal(),
  setPitcher: el => setPitcher(el.dataset.pid),
  quickPitcher: () => {
    const name = document.getElementById('qpName').value.trim();
    if(!name){ toast('Type a name first.'); return; }
    const p = {id:uid(), name, number:'', throws:document.getElementById('qpThrows').value, arsenal:['FB','CB','CH']};
    S.pitchers.push(p); save(); setPitcher(p.id);
    toast(`${name} added with FB, CB, CH. Adjust his pitches in Settings.`);
  },
  sub: () => {
    const g = G(); if(!g) return; const d = derive(g);
    showModal(`<h2>Substitute, spot ${d.slot+1}</h2><div class="form">
      <label>Name<input id="subName" autocapitalize="words" autocomplete="off"></label>
      <div class="row"><label style="flex:1">Number<input id="subNum" inputmode="numeric"></label><label>Bats<select id="subBats"><option>R</option><option>L</option><option>S</option></select></label></div>
      <div class="row"><button class="btn primary" data-act="doSub">Make substitution</button><button class="btn" data-act="closeModal">Cancel</button></div></div>`);
  },
  doSub: () => {
    const g = G(); if(!g) return; const d = derive(g);
    const name = document.getElementById('subName').value.trim();
    if(!name){ toast('Type the new batter\'s name.'); return; }
    g.events.push({t:'sub', slot:d.slot, name, number:document.getElementById('subNum').value.trim(), bats:document.getElementById('subBats').value});
    closeModal(); save(); render(); toast(`${name} now batting ${ordinal(d.slot+1)}.`);
  },
  note: () => {
    const g = G(); if(!g) return; const d = derive(g);
    if(!d.batter.name){ toast('Add this batter\'s name in the lineup first.'); return; }
    const k = scoutKey(g.opponent, d.batter.name);
    const v = prompt(`Scouting note on ${d.batter.name}. It follows him to future games vs ${g.opponent||'this team'}.`, S.scouting[k] || '');
    if(v===null) return;
    if(v.trim()) S.scouting[k] = v.trim(); else delete S.scouting[k];
    save(); render();
  },
  addSlot: () => { const g = G(); g.lineup.push({name:'', number:'', bats:'R'}); save(); render(); },
  removeSlot: () => { const g = G(); if(g.lineup.length>9){ g.lineup.pop(); save(); render(); } },
  addPitcher: () => { S.pitchers.push({id:uid(), name:'', number:'', throws:'R', arsenal:['FB','CB','CH']}); save(); render(); const ins = document.querySelectorAll('[data-pe$=":name"]'); const last = ins[ins.length-1]; if(last) last.focus(); },
  delPitcher: el => { const p = pitcherById(el.dataset.pid); if(!confirm(`Remove ${p?.name||'this pitcher'}? Pitches already charted keep their data but lose his name.`)) return; S.pitchers = S.pitchers.filter(x => x.id!==el.dataset.pid); save(); render(); },
  arsenal: el => { const p = pitcherById(el.dataset.pid); const t = el.dataset.t; p.arsenal = p.arsenal.includes(t) ? p.arsenal.filter(x => x!==t) : PT_ORDER.filter(x => x===t || p.arsenal.includes(x)); save(); render(); },
  ai: el => askAI(el.dataset.k),
  print: () => window.print(),
  exportJSON: () => { download(`pitch-chart-backup-${new Date().toLocaleDateString('en-CA')}.json`, JSON.stringify({...S, settings:{...S.settings, apiKey:''}}, null, 1), 'application/json'); toast('Backup saved. Your API key is not included.'); },
  exportCSV,
  erase: () => { if(!confirm('Erase every game, pitcher, and setting on this device? Export a backup first if you might need them.')) return; if(!confirm('Last check: erase everything?')) return; S = defaults(); save(); view = 'games'; render(); }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if(!el || el.disabled) return;
  const fn = A[el.dataset.act];
  if(fn){ if(el.tagName==='LABEL') return; e.preventDefault(); fn(el); }
});
function bindValue(el){
  const val = el.value;
  if(el.dataset.bind){ const g = G(); if(g){ g[el.dataset.bind] = val || (el.dataset.bind==='startPitcherId' ? null : ''); } }
  else if(el.dataset.lu){ const [i,f] = el.dataset.lu.split(':'); const g = G(); if(g && g.lineup[+i]) g.lineup[+i][f] = val; }
  else if(el.dataset.set){ S.settings[el.dataset.set] = el.dataset.set==='pitchLimit' ? (parseInt(val,10) || 0) : val; }
  else if(el.dataset.pe){ const [id,f] = el.dataset.pe.split(':'); const p = pitcherById(id); if(p) p[f] = val; }
  else return false;
  save(); return true;
}
document.addEventListener('input', e => { if(e.target.tagName!=='SELECT') bindValue(e.target); });
document.addEventListener('change', e => {
  const el = e.target;
  if(el.dataset.change==='copyLineup'){
    const src = S.games.find(x => x.id===el.value); const g = G();
    if(src && g && confirm(`Replace this lineup with the one from ${src.opponent||'that game'} on ${fmtDate(src.date)}?`)){ g.lineup = src.lineup.map(b => ({...b})); if(!g.opponent) g.opponent = src.opponent; save(); }
    render(); return;
  }
  if(el.dataset.change==='import'){ if(el.files[0]) importData(el.files[0]); el.value = ''; return; }
  if(bindValue(el) && el.tagName==='SELECT') render();
});
document.addEventListener('keydown', e => {
  if(e.key==='Enter' && e.target.id==='askq'){ e.preventDefault(); askAI('ask'); }
  if(e.key==='Escape' && !modalEl.hidden) closeModal();
});

/* ---------- Start ---------- */
render();
if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
